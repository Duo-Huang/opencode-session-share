name: Release

# Full release:        vX.Y.Z          -> image + npm
# Service-only:        service-vX.Y.Z  -> image only
on:
  push:
    tags:
      - "v*"
      - "service-v*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Guard service-only release
        if: startsWith(github.ref_name, 'service-')
        shell: bash
        run: |
          set -euo pipefail

          if ! previous="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null)"; then
            echo "::error::cannot determine the previous release tag"
            exit 1
          fi

          changed="$(
            git diff --name-only "$previous".."$GITHUB_REF_NAME" -- plugin/src plugin/package.json \
              | grep -v '\.test\.ts$' || true
          )"

          if [ -n "$changed" ]; then
            echo "::error::plugin runtime changed since $previous; use a full vX.Y.Z release"
            printf '%s\n' "$changed"
            exit 1
          fi

  image:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image version
        run: echo "VERSION=${GITHUB_REF_NAME#service-}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/opencode-session-share \
            -f visibility=public || true

  npm:
    needs: guard
    # service-v* releases only publish the image.
    if: ${{ !startsWith(github.ref_name, 'service-') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$version"
          test "$tag" = "$version"

      - name: Publish
        run: npm publish --access public --provenance
